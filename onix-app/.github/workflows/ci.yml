name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  ci:
    name: Lint · Typecheck · Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: onix-app/package-lock.json

      - name: Install dependencies
        working-directory: onix-app
        run: npm ci

      - name: Lint
        working-directory: onix-app
        run: npm run lint

      - name: Typecheck
        working-directory: onix-app
        run: npm run typecheck

      - name: Unit tests
        working-directory: onix-app
        run: npm test

      - name: Build
        working-directory: onix-app
        run: npm run build

  e2e:
    name: Playwright Smoke Test
    runs-on: ubuntu-latest
    needs: ci
    # Only run E2E on pushes to main (not on every PR to save minutes)
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: onix-app/package-lock.json

      - name: Install dependencies
        working-directory: onix-app
        run: npm ci

      - name: Install Playwright browsers
        working-directory: onix-app
        run: npx playwright install --with-deps chromium

      - name: Start app and run smoke tests
        working-directory: onix-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          BASE_URL: http://localhost:3000
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          npm run build
          npm run start &
          npx wait-on http://localhost:3000 --timeout 30000
          npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: onix-app/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: onix-app
          vercel-args: '--prod'
